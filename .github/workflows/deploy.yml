name: Deploy para a Hostinger

# Roda a cada push no branch principal (e permite disparo manual)
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          # Histórico completo: a versão do produto é 1.0.<nº de commits>
          # (vite.config.ts); com o clone raso padrão a contagem daria 1.
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Compilar o site (gera dist/)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Enviar por FTP para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Conteúdo compilado a enviar:
          local-dir: ./dist/
          # A conta FTP da Hostinger já "cai" DENTRO de public_html —
          # confirmado em 30/07/2026: com ./public_html/ aqui, os arquivos
          # iam parar em public_html/public_html/ e o site servido ficava
          # desatualizado. O destino correto é a raiz da conexão.
          server-dir: ./
