# Configuração do projeto Supabase (CLI). Usada por `supabase functions deploy`
# e `supabase db push` para saber a qual projeto remoto se referir e como
# implantar cada Edge Function.
project_id = "iyxgrvqvthuvvxautrgm"

# create-checkout-session é chamada pelo navegador do cliente logado — o
# comportamento padrão (exigir um JWT válido do Supabase Auth no gateway,
# antes mesmo da função rodar) é o correto aqui, então NÃO desabilitamos
# verify_jwt para ela.

# stripe-webhook é chamada diretamente pelos servidores da Stripe, que
# nunca terão um JWT do Supabase — eles autenticam com o cabeçalho
# `stripe-signature`, verificado dentro da própria função
# (stripe.webhooks.constructEventAsync). Sem verify_jwt = false aqui, o
# gateway do Supabase rejeitaria toda chamada da Stripe com 401 antes de a
# função sequer rodar, e o pagamento nunca seria confirmado no banco mesmo
# a cobrança tendo sido feita de verdade.
[functions.stripe-webhook]
verify_jwt = false

# send-emails fica com o default (verify_jwt = true) E ainda exige, dentro
# da função, Authorization: Bearer <service_role_key> — a anon key pública
# passa no gateway mas não nessa checagem. Só o cron (configurado com a
# service_role key no header) consegue disparar envios.

# tracking-webhook é chamada pelo fornecedor de rastreio (agregador ou
# adaptador Correios), que não tem JWT do Supabase — autentica pelo header
# x-webhook-secret validado dentro da função (fail-closed sem o secret).
# Mesmo raciocínio do stripe-webhook acima.
[functions.tracking-webhook]
verify_jwt = false
